# Релиз (SPEC §12.2–§12.3): workflow_dispatch на main. Версия из git rev-list --count HEAD,
# подпись из секретов, сверка отпечатка, SHA-256, GitHub Release v0.1.<N> с двумя ассетами.
# Права contents: write выданы только джобе release.
name: release

on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Релиз собирается только из main (сейчас ${{ github.ref }})" >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Compute version
        id: version
        run: |
          N=$(git rev-list --count HEAD)
          echo "code=$N" >> "$GITHUB_OUTPUT"
          echo "tag=v0.1.$N" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v0.1.$N" >/dev/null; then
            echo "Тег v0.1.$N уже существует" >&2; exit 1
          fi

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Нет секрета ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature fingerprint
        run: python3 scripts/verify_release_signature.py app/build/outputs/apk/release/app-release.apk

      - name: Package assets
        id: assets
        run: |
          TAG=${{ steps.version.outputs.tag }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/cramin-$TAG.apk"
          (cd dist && sha256sum "cramin-$TAG.apk" > "cramin-$TAG.apk.sha256")
          cat "dist/cramin-$TAG.apk.sha256"
          echo "apk=dist/cramin-$TAG.apk" >> "$GITHUB_OUTPUT"
          echo "sha=dist/cramin-$TAG.apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Release notes from git log
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v0.1.*' 2>/dev/null || true)
          {
            echo "Cramin ${{ steps.version.outputs.tag }}"
            echo
            if [ -n "$PREV" ]; then git log --pretty='- %s' "$PREV..HEAD"; else git log --pretty='- %s' -n 50; fi
          } > notes.md
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Cramin ${{ steps.version.outputs.tag }}" \
            --notes-file notes.md \
            "${{ steps.assets.outputs.apk }}" "${{ steps.assets.outputs.sha }}"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
