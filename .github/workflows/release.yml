# Релиз (SPEC §12.2–§12.3): workflow_dispatch на main. Версия из git rev-list --count HEAD,
# подпись из секретов, SHA-256, exact source kit и draft Release v0.1.<N>.
# Права contents: write выданы только джобе release.
name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: cramin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Релиз собирается только из main (сейчас ${{ github.ref }})" >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify exact checkout and run required gates
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          ./gradlew assembleDebug testDebugUnitTest lintDebug lintRelease -Plive=false --no-daemon > "$RUNNER_TEMP/release-gates.log" 2>&1
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - name: Compute version
        id: version
        run: |
          N=$(git rev-list --count HEAD)
          echo "code=$N" >> "$GITHUB_OUTPUT"
          echo "tag=v0.1.$N" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v0.1.$N" >/dev/null; then
            echo "Тег v0.1.$N уже существует" >&2; exit 1
          fi

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Нет секрета ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon > "$RUNNER_TEMP/release-build.log" 2>&1

      - name: Verify signature fingerprint
        run: python3 scripts/verify_release_signature.py app/build/outputs/apk/release/app-release.apk

      - name: Package assets
        id: assets
        run: |
          TAG=${{ steps.version.outputs.tag }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/cramin-$TAG.apk"
          (cd dist && sha256sum "cramin-$TAG.apk" > "cramin-$TAG.apk.sha256")
          cat "dist/cramin-$TAG.apk.sha256"
          echo "apk=dist/cramin-$TAG.apk" >> "$GITHUB_OUTPUT"
          echo "sha=dist/cramin-$TAG.apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Package matching sources and notices
        run: |
          python3 scripts/package-source-kit.py --output dist
          cp docs/RELEASE-NOTES.md dist/release-notes.md
          cp docs/DISTRIBUTION.md dist/DISTRIBUTION.md
          cp docs/THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          (cd dist && zip -qr cramin-${{ steps.version.outputs.tag }}-notices.zip source-kit/legal DISTRIBUTION.md THIRD_PARTY_NOTICES.md source-kit/LICENSE)
          (cd dist && sha256sum *.apk *.zip > SHA256SUMS)

      - name: Release notes from reviewed document
        run: |
          sed "s/0.1.N/0.1.${{ steps.version.outputs.code }}/g" docs/RELEASE-NOTES.md > notes.md

      - name: Create draft GitHub Release (publication requires review)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git ls-remote --tags origin refs/tags/${{ steps.version.outputs.tag }})"
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --target "$RELEASE_SHA" \
            --title "Cramin ${{ steps.version.outputs.tag }}" \
            --notes-file notes.md \
            "${{ steps.assets.outputs.apk }}" "${{ steps.assets.outputs.sha }}" \
            "dist/cramin-${{ steps.version.outputs.tag }}-source-kit.zip" \
            "dist/cramin-${{ steps.version.outputs.tag }}-notices.zip" "dist/SHA256SUMS"

      - name: Preserve gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-gates.log
            ${{ runner.temp }}/release-build.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
